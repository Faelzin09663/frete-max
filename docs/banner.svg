<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">FreteMax</title>
  <desc id="d">Descubra qual carga realmente vale a pena.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16201e"/>
      <stop offset="1" stop-color="#0b100f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb800" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb800" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="28" fill="url(#glow)"/>

  <!-- estrada -->
  <rect x="0" y="262" width="1280" height="78" fill="#0a0f0e"/>
  <rect x="0" y="262" width="1280" height="4" fill="#ffb800"/>
  <line x1="0" y1="304" x2="1280" y2="304" stroke="#ffb800" stroke-width="6" stroke-dasharray="44 30" opacity="0.85"/>

  <!-- caminhão (mesmo desenho do ícone do app) -->
  <g transform="translate(78 66) scale(2.5)">
    <rect x="0" y="10" width="64" height="48" rx="4" fill="#ffb800"/>
    <rect x="68" y="24" width="32" height="34" rx="6" fill="#ffb800"/>
    <rect x="78" y="30" width="18" height="14" rx="3" fill="#111716"/>
    <rect x="0" y="58" width="100" height="8" rx="2" fill="#ffb800"/>
    <rect x="8" y="20" width="48" height="12" rx="2" fill="#111716"/>
    <rect x="8" y="40" width="8" height="8" rx="1" fill="#111716"/>
    <rect x="21" y="40" width="8" height="8" rx="1" fill="#111716"/>
    <rect x="34" y="40" width="8" height="8" rx="1" fill="#111716"/>
    <rect x="47" y="40" width="8" height="8" rx="1" fill="#111716"/>
    <g fill="#eef1ed" stroke="#111716" stroke-width="3">
      <circle cx="20" cy="69" r="11"/><circle cx="44" cy="69" r="11"/><circle cx="86" cy="69" r="11"/>
    </g>
    <g fill="#111716"><circle cx="20" cy="69" r="4"/><circle cx="44" cy="69" r="4"/><circle cx="86" cy="69" r="4"/></g>
  </g>

  <!-- texto -->
  <text x="390" y="150" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="104" font-weight="700" fill="#f2f4ef" letter-spacing="1">Frete<tspan fill="#ffb800">Max</tspan></text>
  <text x="394" y="196" font-family="'Barlow','Segoe UI',Arial,sans-serif" font-size="29" font-weight="500" fill="#c9d3ce">Descubra qual carga realmente vale a pena.</text>

  <g font-family="'Barlow','Segoe UI',Arial,sans-serif" font-size="19" font-weight="700">
    <rect x="394" y="216" rx="16" width="132" height="32" fill="#ffb800"/>
    <text x="460" y="238" text-anchor="middle" fill="#231800">IA lê a carga</text>
    <rect x="540" y="216" rx="16" width="176" height="32" fill="none" stroke="#ffb800" stroke-width="2"/>
    <text x="628" y="238" text-anchor="middle" fill="#ffb800">código faz a conta</text>
    <rect x="730" y="216" rx="16" width="190" height="32" fill="none" stroke="#ffb800" stroke-width="2"/>
    <text x="825" y="238" text-anchor="middle" fill="#ffb800">rota mais lucrativa</text>
  </g>
</svg>
